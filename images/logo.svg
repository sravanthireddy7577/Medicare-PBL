<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0d9488" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Modern Rounded Shield Container -->
  <path d="M 50 8 
           C 72 8, 86 16, 88 34 
           C 90 60, 68 84, 50 94 
           C 32 84, 10 60, 12 34 
           C 14 16, 28 8, 50 8 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)" />

  <!-- Inner Soft Border -->
  <path d="M 50 13 
           C 70 13, 82 20, 84 35 
           C 86 58, 66 79, 50 88 
           C 34 79, 14 58, 16 35 
           C 18 20, 30 13, 50 13 Z" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.25)" 
        stroke-width="1.5" />

  <!-- Medical Cross Graphic (White with subtle transparency) -->
  <path d="M 44 26 L 56 26 Q 58 26 58 28 L 58 40 L 70 40 Q 72 40 72 42 L 72 54 Q 72 56 70 56 L 58 56 L 58 68 Q 58 70 56 70 L 44 70 Q 42 70 42 68 L 42 56 L 30 56 Q 28 56 28 54 L 28 42 Q 28 40 30 40 L 42 40 L 42 28 Q 42 26 44 26 Z" 
        fill="#ffffff" 
        opacity="0.95" />

  <!-- Dynamic Heartbeat Lifeline Pulse Passing Through the Cross -->
  <path d="M 22 48 
           L 38 48 
           L 43 38 
           L 48 58 
           L 54 32 
           L 59 52 
           L 63 48 
           L 78 48" 
        fill="none" 
        stroke="#0f172a" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Tiny Glowing Pulse Node -->
  <circle cx="54" cy="32" r="2.5" fill="#38bdf8" />
</svg>
